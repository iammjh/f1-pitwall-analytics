name: CI

on:
  push:
  pull_request:

jobs:
  next-app:
    name: Next.js app (types, tests, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    env:
      # Build-time placeholders only. Nothing here connects to a database or sends mail.
      NEXTAUTH_SECRET: ci-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      MONGODB_URI: mongodb://localhost:27017/ci
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm run build

  server:
    name: Express support service (syntax and dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --omit=dev
      - run: node --check server.js
      - run: node --check config/env.js
